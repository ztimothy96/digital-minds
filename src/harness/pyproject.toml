[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "Modal-backed probing/steering pipeline (repeng) with a Streamlit demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "modal",
]

[tool.setuptools]
packages = ["harness"]
