[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quickchat"
version = "0.1.0"
description = "Streamlit quick-chat UI over the HuggingFace Inference API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "huggingface_hub",
]

[tool.setuptools]
packages = ["quickchat"]
